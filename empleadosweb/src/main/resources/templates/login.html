<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVOLUTION - Iniciar Sesion</title>
<link rel="shortcut icon" type="image/png" th:href="@{/assets/images/logos/favicon.png}" />
<link rel="stylesheet" th:href="@{/assets/css/styles.min.css}" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ti-icons@0.1.2/css/themify-icons.min.css">
<link rel="stylesheet" th:href="@{/assets/css/evolution.css}" />
</head>
<body>
	<div class="evo-login-fondo">
		<div class="row justify-content-center w-100 mx-0">
			<div class="col-11 col-sm-8 col-md-6 col-lg-4 col-xxl-3">
				<div class="card evo-login-card mb-0">
					<div class="card-body p-4 p-md-5">
						<div class="text-center mb-4">
							<div class="evo-login-logo"><i class="ti-pulse"></i></div>
							<div class="evo-login-titulo fs-7">EVOLUTION</div>
							<p class="text-muted mb-0 mt-1">Sistema de Empleados y Asistencias</p>
							<p class="text-muted fs-2 mb-0">Mernstackec S.A.S.</p>
						</div>

						<div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
							<i class="ti-alert"></i> Usuario o contrasena incorrectos
						</div>
						<div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
							<i class="ti-check"></i> Sesion cerrada correctamente
						</div>

						<form th:action="@{/login}" method="post">
							<div class="mb-3">
								<label for="username" class="form-label">Usuario</label>
								<div class="input-group">
									<span class="input-group-text"><i class="ti-user"></i></span>
									<input type="text" class="form-control" id="username" name="username"
										placeholder="Ingrese su usuario" required autofocus>
								</div>
							</div>
							<div class="mb-4">
								<label for="password" class="form-label">Contrasena</label>
								<div class="input-group">
									<span class="input-group-text"><i class="ti-lock"></i></span>
									<input type="password" class="form-control" id="password" name="password"
										placeholder="Ingrese su contrasena" required>
									<button class="btn btn-outline-secondary" type="button" id="btnVerClave"
										tabindex="-1" title="Mostrar / ocultar contrasena">
										<i class="ti-eye" id="iconoVerClave"></i>
									</button>
								</div>
							</div>
							<button type="submit" class="btn btn-primary w-100 py-2 fs-4 mb-3 rounded-2">
								<i class="ti-unlock"></i> Ingresar
							</button>
						</form>
						<p class="text-center text-muted fs-2 mb-0">
							<i class="ti-shield"></i> Acceso protegido con roles y auditoria de ingresos
						</p>
					</div>
				</div>
				<p class="text-center mt-3 mb-0" style="color: rgba(255,255,255,.65); font-size: 12px;">
					Mernstackec S.A.S. &copy; 2026 &middot; EVOLUTION v2.0
				</p>
			</div>
		</div>
	</div>
	<script>
		// UX: mostrar / ocultar la contrasena
		document.getElementById('btnVerClave').addEventListener('click', function () {
			var campo = document.getElementById('password');
			var icono = document.getElementById('iconoVerClave');
			var visible = campo.type === 'text';
			campo.type = visible ? 'password' : 'text';
			icono.className = visible ? 'ti-eye' : 'ti-na';
		});
	</script>
</body>
</html>
