<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head><meta charset="utf-8"></head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h5 class="card-title fw-semibold mb-0">Auditoria de Ingresos
				<span class="text-muted fs-4">(ultimos 100 intentos)</span>
			</h5>
			<a th:href="@{/usuarios/listar}" class="btn btn-outline-secondary">
				<i class="ti-angle-left"></i> Volver a Usuarios
			</a>
		</div>

		<div class="table-responsive">
			<table class="table table-hover align-middle">
				<thead class="table-light">
					<tr><th>#</th><th>Usuario</th><th>Fecha y hora</th><th>IP</th><th>Resultado</th></tr>
				</thead>
				<tbody>
					<tr th:each="i : ${listaingresos}">
						<td th:text="${i.idIngreso}"></td>
						<td th:text="${i.username}"></td>
						<td th:text="${#temporals.format(i.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
						<td th:text="${i.ip != null ? i.ip : '-'}"></td>
						<td>
							<span class="badge" th:classappend="${i.exitoso} ? 'bg-success' : 'bg-danger'"
								th:text="${i.exitoso} ? 'EXITOSO' : 'FALLIDO'"></span>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaingresos)}">
						<td colspan="5" class="text-center text-muted py-4">No existen ingresos registrados</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
