<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head><meta charset="utf-8"></head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h5 class="card-title fw-semibold mb-0">Usuarios del Sistema</h5>
			<div>
				<a th:href="@{/usuarios/ingresos}" class="btn btn-outline-secondary">
					<i class="ti-time"></i> Auditoria de Ingresos
				</a>
				<a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
					<i class="ti-plus"></i> Nuevo Usuario
				</a>
			</div>
		</div>

		<div class="table-responsive">
			<table class="table table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>#</th><th>Usuario</th><th>Rol</th><th>Empleado vinculado</th>
						<th>Estado</th><th>Ultimo ingreso</th><th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="u : ${listausuarios}">
						<td th:text="${u.idUsuario}"></td>
						<td class="fw-semibold" th:text="${u.username}"></td>
						<td>
							<span class="badge"
								th:classappend="${u.rol == 'ADMIN'} ? 'bg-primary' :
								               (${u.rol == 'RRHH'} ? 'bg-info' : 'bg-secondary')"
								th:text="${u.rol}"></span>
						</td>
						<td th:text="${u.nombreEmpleado != null ? u.nombreEmpleado : '-'}"></td>
						<td>
							<span class="badge" th:classappend="${u.estado} ? 'bg-success' : 'bg-danger'"
								th:text="${u.estado} ? 'ACTIVO' : 'INACTIVO'"></span>
						</td>
						<td th:text="${u.ultimoIngreso != null ? #temporals.format(u.ultimoIngreso, 'dd/MM/yyyy HH:mm') : 'Nunca'}"></td>
						<td class="text-end">
							<a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
								class="btn btn-sm btn-primary" title="Editar"><i class="ti-pencil"></i></a>
							<a th:href="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
								class="btn btn-sm btn-danger" title="Eliminar"
								onclick="return confirm('Eliminar el usuario ' + this.dataset.nombre + '? Si tiene ingresos o permisos asociados, desactivelo en su lugar.');"
								th:attr="data-nombre=${u.username}"><i class="ti-trash"></i></a>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listausuarios)}">
						<td colspan="7" class="text-center text-muted py-4">No existen usuarios registrados</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
