<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head><meta charset="utf-8"></head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h5 class="card-title fw-semibold mb-0">Catalogo de Departamentos</h5>
			<a th:href="@{/departamentos/nuevo}" class="btn btn-primary"><i class="ti-plus"></i> Nuevo Departamento</a>
		</div>
		<div class="table-responsive">
			<table class="table align-middle">
				<thead>
					<tr><th>Id</th><th>Nombre</th><th>Descripcion</th><th>Area</th><th>Estado</th><th></th></tr>
				</thead>
				<tbody>
					<tr th:each="d : ${listadepartamentos}">
						<td th:text="${d.idDepartamento}"></td>
						<td th:text="${d.nombre}"></td>
						<td th:text="${d.descripcion}"></td>
						<td th:text="${d.nombreArea}"></td>
						<td>
							<span th:if="${d.estado}" class="badge bg-success">ACTIVO</span>
							<span th:unless="${d.estado}" class="badge bg-secondary">INACTIVO</span>
						</td>
						<td>
							<a th:href="@{/departamentos/editar/{id}(id=${d.idDepartamento})}" class="btn btn-sm btn-primary"><i class="ti-pencil-alt"></i></a>
							<a th:href="@{/departamentos/eliminar/{id}(id=${d.idDepartamento})}" class="btn btn-sm btn-danger"
								onclick="return confirm('Esta seguro de eliminar este departamento?');"><i class="ti-trash"></i></a>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listadepartamentos)}">
						<td colspan="6" class="text-center text-muted">No existen departamentos registrados</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
