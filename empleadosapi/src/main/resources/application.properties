spring.application.name=empleadosapi
server.port=8080

# ================= SUPABASE (activo) =================
# SUPABASE_HOST + SUPABASE_PORT + SUPABASE_DB van juntos en la URL:
spring.datasource.url=jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
# SUPABASE_USER:
spring.datasource.username=${DB_USERNAME}
# SUPABASE_PASSWORD:
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool limitado: el pooler de Supabase tiene cupo compartido de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ================= PostgreSQL LOCAL (fallback, comentado) =================
# Para volver a local: comenta el bloque Supabase y descomenta este
#spring.datasource.url=jdbc:postgresql://localhost:5432/empleadosdb
#spring.datasource.username=postgres
#spring.datasource.password=admin1234

# ================= JPA / Hibernate =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cargar data.sql (catalogos) despues de crear el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always